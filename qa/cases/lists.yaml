# Lists (moods): created from setup answers, edited, saved from Find.
- id: LISTS-001
  part: A
  title: Moods and lists round-trip and keep their sort
  how: unit
  area:
    - watch
  expect:
    - a mood saved then reloaded is identical; its sort survives opening a cascade
  refs:
    - tests/js/cas1333-mood-roundtrip.test.mjs
    - tests/js/cas1323-mood-sort-survives-opencascade.test.mjs
    - tests/js/cas1322-mood-agent-delete.test.mjs
- id: LISTS-002
  part: A
  title: A list can be created from a Find search
  how: unit
  area:
    - database
    - watch
  expect:
    - Save as list from Find builds a mood with that search's people or genre
  refs:
    - tests/js/cas1395-mood-from-find.test.mjs
    - "#findSaveAsMoodBtn"
    - "#moodAddBtn"
- id: LISTS-003
  part: A
  title: A list sets its own genre levels (five stops) and Set all genres
  how: browser
  area:
    - watch
  expect:
    - the list sheet shows a five-stop level row per genre and a Set all genres box, with no Override switch or Taste link
    - tapping the junction between boxes 2 and 3 picks Top 10%; only the checkbox toggles a genre; Set all genres at 50% puts every ticked genre at Top 50%
  refs:
    - tests/e2e/list-levels.spec.mjs
    - tests/js/list-levels.test.mjs
- id: LISTS-004
  part: C
  title: Long-pressing a genre row on iPhone never brings up the text magnifier
  how: lee-phone
  area:
    - watch
  expect:
    - press and hold a genre name or level track in the list sheet on iPhone; no magnifier or selection appears, and dragging a level still works
- id: LISTS-005
  part: A
  title: "Lists own their genre levels (CAS-1593): no Override, Taste link or thumbs; row name never toggles; 2/3 boundary is Top 10%"
  how: browser
  area:
    - watch
  expect:
    - "the My taste/Override segment, the Taste link and the read-only thumbs are gone from the list sheet"
    - "tapping a row's name does not change its checkbox"
    - "tapping the track at the 2/3 boundary gives Top 10%"
    - "Set all genres at 50% sets every ticked row and no unticked one"
  refs:
    - tests/e2e/list-levels.spec.mjs
    - tests/js/list-levels.test.mjs
