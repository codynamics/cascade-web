# Lists (moods): created from setup answers, edited, saved from Find.
- id: LISTS-001
  part: A
  title: Moods and lists round-trip and keep their sort
  how: unit
  area:
    - watch
  expect:
    - a mood saved then reloaded is identical; its sort survives opening a cascade
  refs:
    - tests/js/cas1333-mood-roundtrip.test.mjs
    - tests/js/cas1323-mood-sort-survives-opencascade.test.mjs
    - tests/js/cas1322-mood-agent-delete.test.mjs
- id: LISTS-002
  part: A
  title: A list can be created from a Find search
  how: unit
  area:
    - database
    - watch
  expect:
    - Save as list from Find builds a mood with that search's people or genre
  refs:
    - tests/js/cas1395-mood-from-find.test.mjs
    - "#findSaveAsMoodBtn"
    - "#moodAddBtn"
- id: LISTS-003
  part: A
  title: A list sets each genre Off / Include / Favourite, with All on and All off
  how: browser
  area:
    - watch
  expect:
    - the list sheet shows the onboarding Off / Include / ♥ Favourite row per genre and All on / All off buttons, with no five-stop track, Override switch or Taste link
    - tapping a genre's name toggles Off and Include; ♥ makes it a Favourite (orange) and its cards show ♥ in the genre line
  refs:
    - tests/e2e/list-levels.spec.mjs
    - tests/e2e/list-favourites.spec.mjs
    - tests/js/list-levels.test.mjs
    - tests/js/list-favourites.test.mjs
- id: LISTS-004
  part: C
  title: Long-pressing a genre row on iPhone never brings up the text magnifier
  how: lee-phone
  area:
    - watch
  expect:
    - press and hold a genre name in the list sheet on iPhone; no magnifier or selection appears
- id: LISTS-005
  part: A
  title: "Lists own their genres (CAS-1593, CAS-1690): no Override, Taste link or thumbs; row name toggles Off/Include; All on / All off"
  how: browser
  area:
    - watch
  expect:
    - "the My taste/Override segment, the Taste link and the read-only thumbs are gone from the list sheet"
    - "tapping a row's name toggles it Off and Include"
    - "All on turns every Off genre to Include and keeps Favourites; All off turns every genre Off"
  refs:
    - tests/e2e/list-levels.spec.mjs
    - tests/js/list-levels.test.mjs
