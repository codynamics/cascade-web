# Tutorials: the six tours (TOURS), the Tutorials screen and the tutorial banner.
- id: TUT-001
  part: A
  title: Every tour walks end to end with no step skipped
  how: browser
  area:
    - watch-tut
    - tut-lists
    - tut-alerts
    - tut-database
    - tut-agent
    - tut-invite
    - m-tutorials
  expect:
    - from Menu -> Tutorials each tour's step index advances through every step (tutorialAdvance skips a step whose target is missing, which is the failure this case catches)
  refs:
    - tests/e2e/tutorials.spec.mjs
    - "#tutorialsScreen"
    - "#tutHole"
    - "#tutCard"
    - tour:watch
    - tour:moods
    - tour:alerts
    - tour:database
    - tour:agent
    - tour:invite
- id: TUT-002
  part: A
  title: Tour spotlight and card are positioned correctly under UI zoom
  how: browser
  area:
    - watch-tut
    - m-tutorials
  expect:
    - "#tutHole and #tutCard geometry matches the target under Chromium zoom:var(--ui-scale)"
  refs:
    - tests/e2e/CAS-1152.spec.mjs
    - tutorialReposition()
- id: TUT-003
  part: A
  title: Replaying the tour from Account while Moving is open skips covered steps
  how: browser
  area:
    - m-tutorials
  expect:
    - the score row and notify control steps are skipped, not pointed at an off-screen anchor
  refs:
    - tests/e2e/CAS-1079.spec.mjs
    - replayTutorial()
- id: TUT-004
  part: A
  title: Tutorial banner shows once and does not reappear after dismissal
  how: unit
  area:
    - watch-tut
  expect:
    - the banner follows the seen map and the visit flag
  refs:
    - tests/js/cas1534-tutorial-banner.test.mjs
- id: TUT-GEO
  part: A
  title: Every tour step lands on its target and holds still (390x844)
  how: browser
  area:
    - watch-tut
    - tut-lists
    - tut-alerts
    - tut-database
    - tut-agent
    - tut-invite
    - m-tutorials
  expect:
    - ring on the target, arrow tip on the target, bubble on screen and clear of it, nothing moves 500 ms after the bubble shows, no step skipped. Any ticket that adds, removes or changes a tour step updates tests/e2e/tutorial-geometry.spec.mjs in the same commit
  refs:
    - tests/e2e/tutorial-geometry.spec.mjs
    - tutorialReposition()
- id: TUT-005
  part: A
  title: "Watch tutorial pointing (CAS-1581): arrow under Watch from the first frame, Me chip on step 5, card steady on steps 12-14"
  how: browser
  area:
    - watch-tut
  expect:
    - "step 2: the arrow is under Watch from the first frame and the card does not move while the other buttons fade"
    - "step 5: the arrow points at the Me chip, never the screen edge (run with a member who has at least five lists)"
    - "steps 12 to 14: the card appears once, below the film card, with no jump"
  refs:
    - tests/e2e/tutorial-geometry.spec.mjs
    - tutorialReposition()
- id: TUT-006
  part: A
  title: "Bubble holds still after landing on every step of every tour (CAS-1590, CAS-1597, CAS-1599)"
  how: browser
  area:
    - watch-tut
    - tut-lists
    - tut-alerts
    - tut-database
    - tut-agent
    - tut-invite
  expect:
    - "nothing moves 500 ms after the bubble shows, on every step of every tour; Invite step 1's bubble appears once, after the card has settled"
    - "no step is skipped"
  refs:
    - tests/e2e/tutorial-geometry.spec.mjs
- id: TUT-007
  part: C
  title: "iPhone: Watch tutorial step 5 points at the Me chip and the bubble holds still"
  how: device
  area:
    - watch-tut
  expect:
    - "on the iPhone, play the Watch tutorial with a member who has at least five lists; on step 5 the arrow is on the Me chip and the bubble does not move after it appears (scroll timing is not visible on a desktop browser)"
- id: TUT-008
  part: C
  title: "iPhone: Invite tutorial step 1 bubble appears once and holds still"
  how: device
  area:
    - tut-invite
  expect:
    - "on the iPhone, play the Invite tutorial; step 1's bubble appears once, after the card has settled, and does not glide or jump afterwards"
