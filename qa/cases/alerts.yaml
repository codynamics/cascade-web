# Alerts: the in-app Alerts screen (opens on Today), its settings, and the monitor's moments.
- id: ALERTS-001
  part: A
  title: Alerts opens on Today first, then remembers the period for the session
  how: browser
  area:
    - alerts-inapp
  expect:
    - first open of a session is Today; after picking a period it stays; reload or sign-out returns to Today
  refs:
    - tests/e2e/CAS-1465.spec.mjs
- id: ALERTS-002
  part: A
  title: Alerts jump-to lands flush and re-render never flashes
  how: browser
  area:
    - alerts-inapp
  expect:
    - Jump to lands under the sticky chrome and is one-shot; the subtitle says agent for a one-agent account
  refs:
    - tests/e2e/CAS-1475.spec.mjs
    - "#movingScreen"
- id: ALERTS-003
  part: A
  title: Alert moments and switches sync to the account
  how: unit
  area:
    - alerts-email
    - alerts-push
    - alerts-inapp
  expect:
    - turning a moment off on one device is off on the others
  refs:
    - tests/js/cas1193-alert-moments-sync.test.mjs
    - tests/js/cas1198-alerts-switch.test.mjs
    - tests/js/cas1237-alerts-reminders.test.mjs
- id: ALERTS-004
  part: B
  title: Every moment fires for forward progress only, once per film
  how: unit
  area:
    - alerts-email
    - alerts-push
    - alerts-inapp
  expect:
    - each moment fires exactly when the film enters it and never on backward progress
  refs:
    - monitor/transitions.py
    - moment:hits_cinema
    - moment:hits_pvod
    - moment:hits_rent
    - moment:hits_stream
    - moment:past_opening_weekend
    - moment:announced
    - moment:opens_soon
- id: ALERTS-005
  part: B
  title: Film journeys behave - 12 scripted journeys
  how: journey
  area:
    - alerts-inapp
    - tracking
  expect:
    - each journey's expected alerts (and non-alerts) match what the monitor produces day by day
  refs:
    - qa/journeys/age-rating.json
    - qa/journeys/alerts-off-genre.json
    - qa/journeys/backwards.json
    - qa/journeys/below-bar.json
    - qa/journeys/catchup-overlap.json
    - qa/journeys/full-run.json
    - qa/journeys/genre-off.json
    - qa/journeys/not-for-me.json
    - qa/journeys/not-my-service.json
    - qa/journeys/repeat-day.json
    - qa/journeys/watched-before-rent.json
    - qa/journeys/window-not-followed.json
- id: ALERTS-006
  part: A
  title: "From your email (CAS-1584): films are ordinary cards, no Watch On / Watched panels opened out"
  how: unit
  area:
    - alerts-inapp
  expect:
    - "films in a From your email view show as ordinary cards with no Watch On / Watched panel opened under each"
    - "each card's own buttons still answer the email"
    - "the To decide row still clears when every film is answered"
  refs:
    - tests/js/cas1536-batch-view.test.mjs
    - tests/js/cas1537-alert-answer.test.mjs
