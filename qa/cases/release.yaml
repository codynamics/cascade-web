# Release: promote, rehearsal, production check.
- id: REL-001
  part: A
  title: Promote only moves the tested commit to main
  how: unit
  expect:
    - promote.yml merges exactly the commit QA passed
  refs:
    - tests/test_promote_tested_sha.py
- id: REL-002
  part: A
  title: Workflow files parse
  how: unit
  expect:
    - every .github/workflows file is valid YAML with the triggers the standard expects
  refs:
    - tests/test_workflows_parse.py
- id: REL-003
  part: D
  title: Previous release still works on the new schema, and rollback loses no data
  how: claude
  expect:
    - run release-rehearsal.yml (when it exists) and see every step PASS
    - until then run the integrity suite against main's build after the new migrations
  refs:
    - scripts/test-integrity.mjs
- id: REL-004
  part: D
  title: Migrations for the release are applied to production by Lee
  how: sql
  expect:
    - production public.schema_migrations equals the file list of supabase/migrations/ at the release commit
- id: REL-005
  part: PROD
  title: Production serves the release commit
  how: claude
  expect:
    - https://cascademovies.com/version.json commit equals the release commit
    - the published catalogue is under 30 hours old
- id: REL-006
  part: PROD
  title: One test alert reaches the production QA account only
  how: lee-phone
  expect:
    - the QA account (never lee+c1 or a real member) receives one hits_stream alert as push and email within 10 minutes
- id: REL-007
  part: D
  title: "Production migrations 0016 then 0017 are applied before the promote"
  how: sql
  expect:
    - "production public.schema_migrations lists 0016 then 0017, or the approved production accounts lose web access"
  refs:
    - "supabase/migrations/0016_promo_codes.sql"
    - "supabase/migrations/0017_alert_batch_recap_kind.sql"
