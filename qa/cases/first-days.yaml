# First ten days: the simulated new-member journey.
- id: FIRSTDAYS-001
  part: B
  title: First-ten-days simulator expectations hold for accounts a-d
  how: firstdays
  area:
    - firstdays
    - alerts-email
  expect:
    - each of the four first-days accounts gets exactly the alerts its expectation file lists, on the day it lists
  refs:
    - qa/firstdays/a.json
    - qa/firstdays/b.json
    - qa/firstdays/c.json
    - qa/firstdays/d.json
    - qa/sim/age_account.py
    - qa/sim/accounts.py
- id: FIRSTDAYS-002
  part: B
  title: Catch-up alert is sent once for a new account, then daily alerts follow
  how: unit
  area:
    - firstdays
    - alerts-email
  expect:
    - the catch-up digest uses kind catchup_alert and is not repeated the next day
  refs:
    - monitor/tests/test_cas1537_answers.py
    - digest:catchup_alert
    - moment:new_to_agent
    - moment:newly_qualifies
- id: FIRSTDAYS-003
  part: B
  title: "Day 0: the Watch tutorial starts by itself; Alerts is empty (planned: CAS-1583 follow-up check)"
  how: planned
  area:
    - firstdays
    - watch-tut
  expect:
    - "a new account's first Watch visit starts the Watch tutorial without a tap"
    - "Alerts is empty and says \"<agent> reports every morning\""
  refs:
    - "monitor/firstdays.py"
    - "qa/firstdays/a.json"
- id: FIRSTDAYS-004
  part: B
  title: "Day +1 catch-up: top 3 in cinemas, 5 coming, 10 streaming on the member's services"
  how: firstdays
  area:
    - firstdays
    - alerts-email
  expect:
    - "top 3 in cinemas, top 5 coming to cinemas, top 10 streaming on the member's own services"
    - "watched films and empty groups are skipped"
    - "one push at 7:30 names the top two films"
    - "the 17:00 email lists only catch-up films not yet seen"
    - "the same stage is never announced twice"
  refs:
    - "monitor/catchup.py"
    - "monitor/firstdays.py"
    - "qa/firstdays/a.json"
    - "qa/firstdays/b.json"
    - "digest:catchup_alert"
- id: FIRSTDAYS-005
  part: B
  title: "Tutorial banner from day +1: hidden for good after a second ✕"
  how: browser
  area:
    - firstdays
  expect:
    - "the banner shows only on a screen whose tutorial has not been played"
    - "at most one banner per visit (a new visit is an app open or a return after 30+ minutes)"
    - "after a second ✕ it never returns"
  refs:
    - "tests/js/cas1534-tutorial-banner.test.mjs"
    - "qa/firstdays/a.json"
- id: FIRSTDAYS-006
  part: B
  title: "Rating reminder card from day +2 while fewer than 5 Watched ratings (planned: CAS-1583 follow-up check)"
  how: planned
  area:
    - firstdays
    - taste
  expect:
    - "the card is never a rating sheet and has a ✕"
    - "shown at most 3 times in total, counted in user_prefs.view.rnudge.rem"
    - "never in a visit that already showed a tutorial or banner"
    - "events taste_reminder_shown and taste_reminder_dismiss are recorded"
  refs:
    - "tests/js/cas1566-watch-nudge.test.mjs"
    - "qa/firstdays/d.json"
- id: FIRSTDAYS-007
  part: B
  title: "Taste card after 10+ ratings and a real adjustment of 5+ points (planned: CAS-1583 follow-up check)"
  how: planned
  area:
    - firstdays
    - taste
  expect:
    - "the card says \"<agent> has learned something\" and names the strongest adjustment"
    - "See Taste opens Taste"
    - "shown once"
    - "events taste_card_shown, taste_card_open and taste_card_dismiss are recorded"
  refs:
    - "tests/js/cas1479-taste-applied.test.mjs"
    - "qa/firstdays/a.json"
- id: FIRSTDAYS-008
  part: B
  title: "Day +7 first-week recap email \"Your first week with <agent>\""
  how: unit
  area:
    - firstdays
    - alerts-email
  expect:
    - "merged into the 17:00 email with no push"
    - "lists films alerted and up to 5 still to decide (newest first, with the Watch On / Watched buttons), rating count as one text line"
    - "batch kind recap; each named film has a ledger row and the recap has its own view in Alerts"
    - "sent even with nothing left (\"You're all caught up.\")"
    - "sent once: a failed send retries the same day, days 6 and 8 never send it"
  refs:
    - "monitor/recap.py"
    - "monitor/tests/test_cas1567_recap.py"
    - "qa/firstdays/a.json"
    - "qa/firstdays/d.json"
- id: FIRSTDAYS-009
  part: B
  title: "Across all ten days: at most one email and one push a day; one card or banner per visit (planned: CAS-1583 follow-up check)"
  how: planned
  area:
    - firstdays
    - alerts-email
    - alerts-push
  expect:
    - "no account gets more than one email or one push on any day"
    - "at most one card or banner per visit, never a pop-up"
  refs:
    - "monitor/firstdays.py"
    - "qa/firstdays/c.json"
- id: FIRSTDAYS-010
  part: B
  title: "A push or email link opens its own \"From your email\" view in Alerts"
  how: browser
  area:
    - firstdays
    - alerts-inapp
  expect:
    - "the view has the band, an All alerts button and a To decide row until every film is answered"
    - "an emailed film stays in its view, tagged Watched, after it is watched"
  refs:
    - "tests/js/cas1536-batch-view.test.mjs"
    - "monitor/batches.py"
- id: FIRSTDAYS-011
  part: B
  title: "Never: any one-off rating exercise (planned: CAS-1583 follow-up check)"
  how: planned
  area:
    - firstdays
    - taste
  expect:
    - "no \"Seen any of these?\" sheet, no rating push and no rating email prompt on any day"
    - "finding one fails the run"
  refs:
    - "monitor/firstdays.py"
- id: FIRSTDAYS-012
  part: B
  title: "Buttons: wording in emails and Alerts is exactly the app's"
  how: unit
  area:
    - firstdays
    - alerts-email
  expect:
    - "Watch On: Cinema, Premium, Rent, Stream, Never (Premium, Rent and Cinema only when switched on for that member)"
    - "Watched: Wow!, Watch Again, Enjoyed, So-so, Disliked"
    - "an email button is a signed one-tap link to alert-answer that records the answer, shows a confirmation page with \"Open in Cascade\", and removes the film from To decide in the app"
  refs:
    - "monitor/answer_links.py"
    - "monitor/tests/test_cas1537_answers.py"
    - "tests/js/cas1537-alert-answer.test.mjs"
