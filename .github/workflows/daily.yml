name: Daily AU movie refresh

# Once a day in the cloud: rebuild today's AU catalogue, commit the refreshed app + data (so
# GitHub Pages serves the latest AND git history carries "yesterday" for the diff), run the
# Contact-us digest, then the night's health assertions. Also runnable on demand from the Actions
# tab.
#
# CAS-993: the Cascade monitor (diff today vs yesterday, match to each user's Cascades, de-dupe,
# email/push one alert per user) moved out of this workflow into alerts.yml, which sends at a
# fixed 17:00 Sydney time instead of whenever this refresh happens to run. This workflow no longer
# runs the monitor at all — see alerts.yml.
#
# Secrets are read from GitHub Actions secrets only (never hardcoded). When the Supabase + Resend
# secrets are absent (e.g. a first manual run before you've added them), the Contact-us digest
# runs in --dry-run so the workflow still passes.

on:
  workflow_dispatch:             # manual "Run workflow" button
    inputs:
      days_back:
        description: "Demo: diff the monitor against the catalogue this many days ago so real transitions fire and a digest actually sends (for building/validating the notification UX). 0 = normal ~yesterday behaviour."
        required: false
        default: "0"
      baseline_ref:
        description: "Demo (advanced): diff against this exact git ref's movies.json. Overrides days_back. Blank = use days_back."
        required: false
        default: ""
      probe_title:
        description: "CAS-607 diagnostic: probe TMDB for one title (why isn't it in the catalogue?) instead of the daily refresh. Prints candidates + AU release dates + AU providers + an ingest verdict, then exits — no ingest, no commit, no monitor, no qa.yml dispatch. Blank = normal refresh. (Only appears in the Actions UI once this input has reached main via a promote.)"
        required: false
        default: ""

permissions:
  contents: write                # allow the job to commit the refreshed files
  actions: write                 # CAS-523: allow dispatching qa.yml at the end of this run

concurrency:                     # never let two daily runs overlap
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (carries yesterday's state for change-detection)
        uses: actions/checkout@v7
        with:
          ref: staging           # the repo's default branch is main; refresh must land on staging, never main
          fetch-depth: 0         # full history: the health step's catalogue_size/score_coverage checks anchor "yesterday" to the last refresh on an EARLIER day, not HEAD~1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe a title (CAS-607)
        # Diagnostic-only mode: when probe_title is set, run ONLY the probe against TMDB and
        # exit — no ingest, no commit, no monitor, no qa.yml dispatch. Every step below is
        # skipped for this run.
        if: ${{ github.event.inputs.probe_title != '' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PROBE_TITLE: ${{ github.event.inputs.probe_title }}
        run: python scripts/catalogue_sizing.py --probe "$PROBE_TITLE"

      - name: Build today's catalogue (ingest → enrich → poll → derive → build)
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          # CAS-1003: pass the repo variable through as-is — no `|| '0'` fallback — so an unset
          # variable and an explicit "0" stay distinguishable downstream (monitor/health.py's
          # watchmode_fetch check). poc_pipeline.py's own WM_RUN_MAX_CREDITS still coerces an
          # unset/empty value to 0 for actual spend gating, so this changes nothing about what
          # the run spends.
          WM_RUN_MAX_CREDITS: ${{ vars.WM_RUN_MAX_CREDITS }}
        run: python poc_pipeline.py

      - name: Commit refreshed app + data (this becomes "today" for tomorrow's diff)
        if: ${{ github.event.inputs.probe_title == '' }}
        run: |
          git config user.name  "cascade-bot"
          git config user.email "actions@users.noreply.github.com"
          # CAS-758: a rebase-based retry here structurally conflicted whenever the CC-web worker
          # pushed during the ~19-minute build (the normal case, not a rare race), since its own
          # `npm run build` touches this exact same index.html. `git reset --soft` onto the
          # current remote tip never conflicts: it just re-parents this commit onto whatever is
          # there now. The non-owned-path sync (git checkout HEAD -- . ':!...') pulls in any
          # template/source change the remote made, so the rebuild below is always against the
          # CURRENT app_template.html, not a stale one — see scripts/reset_soft_and_push.sh for
          # the same algorithm's standalone, tested form.
          attempt=1
          pushed=0
          while [ "$attempt" -le 3 ]; do
            git fetch origin staging
            if ! git reset --soft origin/staging; then
              echo "::error::git reset --soft onto origin/staging failed"
              exit 1
            fi
            git checkout HEAD -- . ':!index.html' ':!movies.json' ':!state' ':!catalogue' ':!catalogue.json'
            python poc_pipeline.py --build-html
            git add index.html movies.json state catalogue.json
            git add -A catalogue
            git commit -m "Daily refresh $(date -u +%F)" || echo "nothing to commit"
            if git push origin HEAD:staging; then
              pushed=1
              break
            fi
            echo "push rejected (attempt $attempt/3), retrying after reset + rebuild"
            attempt=$((attempt + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push to staging after 3 attempts"
            exit 1
          fi

      - name: Live-size the catalogue (CAS-354 — TMDB discover total_results)
        # Current-scope vs widened-AU-watchable totals, straight from TMDB discover. The TMDB
        # key only exists here (never on the dev PC), so this step is the only place it can run.
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/catalogue_sizing.py
          git config user.name  "cascade-bot"
          git config user.email "actions@users.noreply.github.com"
          # CAS-758: same reset-soft-and-rebuild retry as the "Commit refreshed app + data" step
          # above — the rebuild here is defensive (this step's own diff is only the sizing
          # report), keeping index.html perpetually rebuilt against whatever app_template.html is
          # on staging by the time this step pushes.
          attempt=1
          pushed=0
          while [ "$attempt" -le 3 ]; do
            git fetch origin staging
            if ! git reset --soft origin/staging; then
              echo "::error::git reset --soft onto origin/staging failed"
              exit 1
            fi
            git checkout HEAD -- . ':!docs/appraisals/cas-catalogue-sizing.md'
            python poc_pipeline.py --build-html
            git add docs/appraisals/cas-catalogue-sizing.md
            git commit -m "CAS-354: catalogue sizing $(date -u +%F)" || echo "nothing to commit"
            if git push origin HEAD:staging; then
              pushed=1
              break
            fi
            echo "push rejected (attempt $attempt/3), retrying after reset + rebuild"
            attempt=$((attempt + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push to staging after 3 attempts"
            exit 1
          fi

      - name: Run the Contact-us digest (CAS-836)
        # Same secrets-present/--dry-run split as the health step's own dry-run tolerance below:
        # with all three present this sends the real digest and stamps sent_at; without them it
        # renders and sends nothing, so the workflow still passes before the secrets are configured.
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CASCADE_CONTACT_TO: ${{ secrets.CASCADE_CONTACT_TO }}
        run: |
          DRYRUN=""
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$RESEND_API_KEY" ]; then
            DRYRUN="--dry-run"
          fi
          python -m monitor.contact $DRYRUN

      - name: Dispatch qa.yml (CAS-523)
        # The commits above were pushed with the default GITHUB_TOKEN, so GitHub's anti-recursion
        # protection silently suppresses qa.yml's `push` trigger for them — meaning promote.yml's
        # gate would never fire for a daily-refresh-only push. An explicit API dispatch is not
        # subject to that suppression, so this keeps main from drifting behind a staging refresh
        # that has no other ticket push to piggyback on.
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run qa.yml --ref staging

      - name: Run nightly health assertions (CAS-974/CAS-993)
        # The literal last step: asserts the night's work actually happened (catalogue size/
        # integrity, TMDB/Watchmode/OscarBase call+error tallies, a live anon-role usage_events
        # insert, a live canary sign-in) rather than trusting a green workflow. Runs after qa.yml's
        # dispatch above so a health failure here never blocks that unrelated code-quality gate.
        # SUPABASE_ANON_KEY/SUPABASE_SERVICE_ROLE_KEY/CASCADE_CANARY_EMAIL are secrets (Lee's
        # step, CAS-974 hand-off) — CAS-995: until they exist, the checks that need them report
        # "fail" (not "unknown") with detail "not configured: <NAME>" naming the missing secret,
        # and DO fail the run — a configuration gap is not a quiet night. CAS-996: Cascade accounts are
        # passwordless, so the canary session comes from admin/generate_link (service-role key) +
        # verify (anon key), never a stored account password. CAS-993: email/push delivery is no
        # longer asserted here — the monitor doesn't run in this workflow any more, so there is
        # nothing yet to check; --scope daily excludes those two checks entirely rather than
        # reporting them "unknown" for a run that hasn't happened yet. alerts.yml asserts them
        # itself, straight after its own monitor step, and merges the result into this same
        # state/health.json.
        if: ${{ github.event.inputs.probe_title == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CASCADE_CANARY_EMAIL: ${{ secrets.CASCADE_CANARY_EMAIL }}
          # CAS-1003: this step's own shell never inherited the build step's WM_RUN_MAX_CREDITS —
          # each step gets a fresh env — so watchmode_fetch was reading it as unset every single
          # run regardless of the repo variable. Pass it through as-is (no fallback) so the check
          # sees the same unset/explicit-"0" distinction the build step now does.
          WM_RUN_MAX_CREDITS: ${{ vars.WM_RUN_MAX_CREDITS }}
        run: |
          HEALTH_EXIT=0
          python -m monitor.health --scope daily || HEALTH_EXIT=$?
          git config user.name  "cascade-bot"
          git config user.email "actions@users.noreply.github.com"
          # Same reset-soft-and-commit retry as the catalogue-sizing step above, minus the rebuild
          # step — state/health.json and state/run_stats.json are plain data, never derived from
          # app_template.html, so there is nothing to regenerate before committing them.
          attempt=1
          pushed=0
          while [ "$attempt" -le 3 ]; do
            git fetch origin staging
            if ! git reset --soft origin/staging; then
              echo "::error::git reset --soft onto origin/staging failed"
              exit 1
            fi
            git checkout HEAD -- . ':!state/health.json' ':!state/run_stats.json'
            git add state/health.json state/run_stats.json
            git commit -m "CAS-974: nightly health report $(date -u +%F)" || echo "nothing to commit"
            if git push origin HEAD:staging; then
              pushed=1
              break
            fi
            echo "push rejected (attempt $attempt/3), retrying after reset"
            attempt=$((attempt + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push the health report to staging after 3 attempts"
            exit 1
          fi
          exit $HEALTH_EXIT

  # CAS-973: email someone the moment this workflow breaks, instead of leaving it to be
  # noticed by whoever next opens the Actions tab. CAS-995: `secrets: inherit` (the one
  # secret/env reference this ticket authorises adding here) replaces the three named secrets
  # below with everything this workflow has access to, so alert.yml's new push channel
  # (SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY/APNS_*) reaches it too without naming each one.
  alert:
    needs: [refresh]
    if: failure()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/alert.yml
    with:
      workflow_name: "daily"
    secrets: inherit
