# .github/workflows/promote.yml — Codynamics Development Standard (Cascade web)
# The shipper. CAS-1522: auto-promote is retired — this runs ONLY on a manual `workflow_dispatch`
# (a release decision). Catalogue-only refreshes reach main via promote-data.yml instead.
# main is written ONLY here, and only as a plain merge: main must stay a pure descendant of the
# QA'd staging commit, so this job never rebuilds or commits generated files (index.html,
# movies.json, state/*) on main — an independent rebuild-on-main is what caused promote run #16's
# index.html merge conflict. Pages source is "Deploy from a branch: main", so pushing main
# IS the production deploy (the built-in Pages pipeline publishes cascademovies.com). We do
# NOT use upload-pages-artifact/deploy-pages — that is only for Pages source = GitHub Actions.
name: promote

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to merge into main (defaults to the head of staging when empty)"
        required: false
      rollback_to:
        description: "Rollback: a tag vX.Y.Z or a commit already on main. When set, main's tree is made equal to it in one new commit (no force push). Leave empty for a normal promote."
        required: false

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CAS-1550: rollback. main's tree becomes the target's tree in ONE new commit on top of main —
      # history is never rewritten and nothing is force-pushed. The target must already be an
      # ancestor of main. The normal merge step below is skipped when this one runs.
      - name: Roll main back to a previous release
        id: rollback
        if: ${{ inputs.rollback_to != '' }}
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          set -euo pipefail
          git config user.name  "ci-promote"
          git config user.email "ci@codynamics.com.au"
          before=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          target=$(git rev-parse --verify --quiet "${ROLLBACK_TO}^{commit}") || {
            echo "::error::rollback_to '$ROLLBACK_TO' is not a known tag or commit"; exit 1; }
          if ! git merge-base --is-ancestor "$target" HEAD; then
            echo "::error::rollback_to '$ROLLBACK_TO' ($target) is not an ancestor of main - refusing"
            exit 1
          fi
          new=$(git commit-tree "${target}^{tree}" -p HEAD -m "rollback: main to $ROLLBACK_TO")
          git merge --ff-only "$new"

      - name: Merge the QA'd staging commit into main
        id: merge
        if: ${{ inputs.rollback_to == '' }}
        run: |
          set -euo pipefail
          git config user.name  "ci-promote"
          git config user.email "ci@codynamics.com.au"
          before=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.sha }}" ]; then
            sha="${{ inputs.sha }}"
          else
            git fetch origin staging
            sha=$(git rev-parse origin/staging)
          fi
          git fetch origin "$sha"
          git merge --no-ff -X theirs FETCH_HEAD -m "promote: staging@$sha"

      # CAS-1601: the production build stamp. Pages serves main as committed, so without this the site
      # shows the stamp committed on staging. Stamp version.json + build-info.js (only) with the
      # promoted merge commit and a build number counted from it, then commit just those two files on
      # top. A plain commit on top keeps main a descendant of the QA'd staging commit; the next promote's
      # merge takes staging's copy of these files (-X theirs), so they never conflict.
      - name: Stamp the production build (promoted commit + build number)
        if: ${{ inputs.rollback_to == '' }}
        run: |
          set -euo pipefail
          promoted=$(git rev-parse HEAD)
          CF_PAGES_COMMIT_SHA="$promoted" python poc_pipeline.py --stamp-deploy
          git add version.json build-info.js
          if git diff --cached --quiet; then
            echo "production stamp already current"
          else
            git commit -m "stamp: production build for $promoted"
          fi

      - name: Read the shipped release version
        id: ver
        run: |
          set -euo pipefail
          echo "version=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Push main — the production deploy (main -> Pages)
        run: git push origin main

      # CAS-1550: every normal promote leaves a tag, so there is always something to roll back to.
      - name: Tag the release commit on main
        if: ${{ inputs.rollback_to == '' }}
        run: |
          set -euo pipefail
          tag="release-$(date -u +%Y%m%dT%H%M%SZ)"
          git tag "$tag" HEAD
          git push origin "$tag"

      - name: Close the board — Done + v<version> on every ticket that shipped
        if: ${{ inputs.rollback_to == '' }}
        env:
          JIRA_BASE_URL:  ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:     ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RANGE_FROM:     ${{ steps.merge.outputs.before }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: python ci/close_shipped.py

  # CAS-973: email someone the moment this workflow breaks, instead of leaving it to be
  # noticed by whoever next opens the Actions tab.
  alert:
    needs: [promote]
    if: failure()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/alert.yml
    with:
      workflow_name: "promote"
      consecutive_failures: 3
      min_red_hours: 6
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CASCADE_EMAIL_FROM: ${{ secrets.CASCADE_EMAIL_FROM }}
      CASCADE_ALERT_TO: ${{ secrets.CASCADE_ALERT_TO }}
