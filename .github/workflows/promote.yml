# .github/workflows/promote.yml — Codynamics Development Standard (Cascade web)
# The shipper. Fires automatically when qa.yml succeeds on staging — no tag, no human step.
# A manual `workflow_dispatch` run is also always available as an override.
# main is written ONLY here, and only as a plain merge: main must stay a pure descendant of the
# QA'd staging commit, so this job never rebuilds or commits generated files (index.html,
# movies.json, state/*) on main — an independent rebuild-on-main is what caused promote run #16's
# index.html merge conflict. Pages source is "Deploy from a branch: main", so pushing main
# IS the production deploy (the built-in Pages pipeline publishes cascademovies.com). We do
# NOT use upload-pages-artifact/deploy-pages — that is only for Pages source = GitHub Actions.
name: promote

on:
  workflow_run:
    workflows: [qa]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge the QA'd staging commit into main
        id: merge
        run: |
          set -euo pipefail
          git config user.name  "ci-promote"
          git config user.email "ci@codynamics.com.au"
          before=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch origin staging
            sha=$(git rev-parse origin/staging)
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          git fetch origin "$sha"
          git merge --no-ff -X theirs FETCH_HEAD -m "promote: staging@$sha"

      - name: Read the shipped release version
        id: ver
        run: |
          set -euo pipefail
          echo "version=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Push main — the production deploy (main -> Pages)
        run: git push origin main

      - name: Close the board — Done + v<version> on every ticket that shipped
        env:
          JIRA_BASE_URL:  ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:     ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RANGE_FROM:     ${{ steps.merge.outputs.before }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: python ci/close_shipped.py

  # CAS-973: email someone the moment this workflow breaks, instead of leaving it to be
  # noticed by whoever next opens the Actions tab.
  alert:
    needs: [promote]
    if: failure()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/alert.yml
    with:
      workflow_name: "promote"
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CASCADE_EMAIL_FROM: ${{ secrets.CASCADE_EMAIL_FROM }}
      CASCADE_ALERT_TO: ${{ secrets.CASCADE_ALERT_TO }}
