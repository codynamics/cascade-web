# Codynamics Development Standard (Cascade web) — the reusable failure-alert workflow.
#
# CAS-973: reusable failure alert, called as the final `if: failure()` job of every
# scheduled/CI workflow (daily, rls, recommend, qa, promote, the Watchmode backfill, iOS
# TestFlight) so a broken run notifies someone instead of sitting silent until someone opens
# the Actions tab. A `workflow_call` job runs inside the SAME run as the workflow that calls
# it (they share `github.run_id`), so it reads the failing job/step and log tail straight off
# this run via the Actions API — the caller only has to pass its own human-readable name.
#
# Needs `actions: read` to list this run's jobs/steps and read the failing step's log. A
# reusable workflow can only use permissions its caller grants, so each caller job sets
# `permissions: { contents: read, actions: read }` next to its own `uses:` line.
#
# Secrets: reuses RESEND_API_KEY and CASCADE_EMAIL_FROM (already used by monitor/emailer.py).
# CASCADE_ALERT_TO is new (CAS-973) and, since it names the one account this whole alert path
# exists to notify, is no longer optional-and-silent (CAS-995): scripts/send_alert.py now exits
# non-zero without it, so a caller that forgets to pass it shows red instead of silently doing
# nothing. RESEND_API_KEY/CASCADE_EMAIL_FROM absent still degrades gracefully (skips email only).
#
# CAS-995: a second, independent channel — an APNs push to CASCADE_ALERT_TO's own device tokens
# — reuses monitor/pusher.py and the existing SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY/APNS_*
# secrets. All four optional new secrets below degrade the same way: absent -> push skipped,
# email still sent (and vice versa) — see scripts/send_alert.py's send_email_alert/send_push_alert.
name: alert

on:
  workflow_call:
    inputs:
      workflow_name:
        description: "Human name of the calling workflow, for the alert subject/body."
        required: true
        type: string
    secrets:
      RESEND_API_KEY:
        required: false
      CASCADE_EMAIL_FROM:
        required: false
      CASCADE_ALERT_TO:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      APNS_KEY_ID:
        required: false
      APNS_TEAM_ID:
        required: false
      APNS_AUTH_KEY:
        required: false
      APNS_BUNDLE_ID:
        required: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Find the failing job/step in this run, email via Resend and push via APNs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CASCADE_EMAIL_FROM: ${{ secrets.CASCADE_EMAIL_FROM }}
          CASCADE_ALERT_TO: ${{ secrets.CASCADE_ALERT_TO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_AUTH_KEY: ${{ secrets.APNS_AUTH_KEY }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
        run: python scripts/send_alert.py
