# .github/workflows/ios-testflight.yml — Codynamics Development Standard (Cascade web)
#
# CAS-454: manual iOS TestFlight release for the Capacitor wrapper added in CAS-453.
# workflow_dispatch only, deliberately — this is a chat-triggered, later step per the standard's
# mobile-release pattern (web tickets still ship to main normally via promote.yml). It builds
# whatever is on the triggering branch/ref at run time, not a specific commit.
#
# The ticket pointed at LCP2/MaxVsTheWorlds's ios-testflight.yml as a working template to copy;
# that repo has no commits (0 refs), so there was nothing to copy from. This follows the standard
# Apple/GitHub-documented certificate-import pattern + Fastlane's App Store Connect API key flow
# instead. See the ticket comment for the exact secret names this expects.
#
# CAS-555: optional `web_url` dispatch input points the built app's WebView at a live https URL
# instead of the bundled www/, so an app-only UI bug can be checked in ~minutes instead of a full
# TestFlight round trip. QA instrument only — a server.url build must never go to App Store review,
# and it does not exercise the capacitor://localhost origin (see the job summary for what it can't
# reproduce). Leave the input blank for a normal, unmodified bundled build.
name: ios-testflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version x.y.z, next after the newest v* git tag"
        required: true
        type: string
      web_url:
        description: "Run the app live against this https URL instead of the bundled www/. Leave blank for a normal bundled build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate version input
        run: |
          set -euo pipefail
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be x.y.z (digits only), e.g. 1.2.3. Got: '${{ inputs.version }}'"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web deps, build www/, sync the iOS project
        env:
          WEB_URL: ${{ inputs.web_url }}
        run: |
          set -euo pipefail
          npm ci
          npm run build

          if [ -n "$WEB_URL" ]; then
            case "$WEB_URL" in
              https://*) ;;
              *)
                echo "::error::web_url must be an https:// URL — iOS App Transport Security blocks a cleartext origin and the app would ship as a white screen. Got: $WEB_URL"
                exit 1
                ;;
            esac

            node -e '
              const fs = require("fs");
              const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              config.appName = "Cascade Live";
              config.server = { url: process.env.WEB_URL, cleartext: false };
              fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2) + "\n");
            '

            {
              echo "### iOS TestFlight build mode: LIVE URL"
              echo ""
              echo "Loads \`$WEB_URL\` in the WebView instead of the bundled \`www/\`."
              echo ""
              echo "**QA instrument only — never submit this build to App Store review.** It does not exercise the \`capacitor://localhost\` origin, so it will not reproduce origin-scoped bugs (CORS, localStorage partitioning)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### iOS TestFlight build mode: bundled"
              echo ""
              echo "Runs the \`www/\` copy baked in at build time (unchanged from every prior run)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Standard pattern for non-interactive macOS runners: import the distribution certificate
      # and provisioning profile into a fresh, temporary keychain for this job only.
      - name: Import signing certificate + provisioning profile
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/dist_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"

          echo -n "$IOS_DIST_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DIST_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build + upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_VERSION: ${{ inputs.version }}
        run: bundle exec fastlane ios beta

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true

      - name: Tag v${{ inputs.version }}
        if: success()
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "::error::Tag $TAG already exists on origin — refusing to overwrite it."
            exit 1
          fi
          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"

  # CAS-973: email someone the moment this workflow breaks, instead of leaving it to be
  # noticed by whoever next opens the Actions tab.
  alert:
    needs: [testflight]
    if: failure()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/alert.yml
    with:
      workflow_name: "ios-testflight"
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CASCADE_EMAIL_FROM: ${{ secrets.CASCADE_EMAIL_FROM }}
      CASCADE_ALERT_TO: ${{ secrets.CASCADE_ALERT_TO }}
