# .github/workflows/qa.yml — Codynamics Development Standard (Cascade web)
# The quality gate. Runs the smoke suite on every push to staging. Green here is the only thing
# that lets promote.yml ship.
#
# CAS-325: split into independent jobs (no `needs` between them except where a job genuinely
# needs the built index.html) so everything starts at once instead of queueing behind one
# runner. GitHub already fails the whole workflow's conclusion the moment any one job fails,
# which is the exact thing promote.yml's `workflow_run` gate reads — so a red job still blocks
# promote with no extra merge/gate job needed.
#
# CAS-385: e2e was a 4-shard fan-out over ~100 per-ticket specs, each pinned to one commit's
# exact copy/DOM — cosmetic UI changes kept turning the gate red for reasons that were not
# regressions. It is now a single job running the fixed critical-path smoke suite
# (tests/e2e/smoke.spec.mjs), with retries to absorb genuine flake instead of a sharded blast
# radius. See that file's header for what the five checks cover and why.
#
# CAS-462: once the 5 jobs below are green, mark-on-staging tells Jira the shipped tickets
# reached the "On Staging" checkpoint — that status previously had zero issues ever, because
# nothing transitioned to it; promote.yml's ci/close_shipped.py jumped tickets straight to Done.
#
# CAS-482: the symmetric failure path. Each of the 5 jobs below now tees its test output to a
# log file and, on failure, greps the first recognisable failure line into a small artifact.
# on-failure (bottom of this file) collects those artifacts once any job goes red, and calls
# ci/mark_qa_failed.py to comment on the ticket, requeue it to Ready for Dev, and re-add
# needs-cc-web — closing the loop mark-on-staging only closed for the success case.
#
# CAS-523: `daily.yml` pushes its refresh commit using the default GITHUB_TOKEN, and GitHub
# Actions deliberately does not fire other workflows' `push` triggers for GITHUB_TOKEN-authored
# commits (anti-recursion protection). That silently skipped this workflow (and so promote.yml's
# gate) for every daily-refresh-only push, leaving main stale until an unrelated ticket push
# happened to carry the refresh commit along. `workflow_dispatch` lets daily.yml explicitly
# trigger this workflow via the API (`gh workflow run qa.yml --ref staging`) at the end of its
# run, which is not subject to that suppression.
#
# CAS-759: the same GITHUB_TOKEN suppression applies one hop later. This workflow's own
# completion is a `workflow_run` event, which promote.yml listens for — but that event is not
# emitted for a run that was itself started by a GITHUB_TOKEN-authenticated `workflow_dispatch`
# call (the one CAS-523 added above). So a daily-refresh-only push made qa run, but never made
# promote run, leaving main stale until an unrelated ticket push piggybacked the refresh commit
# along. dispatch-promote (bottom of this file) closes that gap by explicitly dispatching
# promote.yml when qa itself was started via workflow_dispatch — a normal push-triggered qa run
# still promotes through promote.yml's own workflow_run trigger exactly as before.
name: qa

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Confirms the committed index.html matches what app_template.html + movies.json actually
  # build to. Independent of every other job below — none of them trust the committed
  # index.html, they each build their own.
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app
        run: python poc_pipeline.py --build-html

      # A build that changes index.html beyond its stamps means the commit shipped a stale build.
      # BUILD_INFO is the per-build stamp and always moves. BUILD_DATE is the catalogue's own
      # `generated` date - deterministic across rebuilds since CAS-503, but still excluded
      # defensively in case that ever changes. Real app drift still trips this.
      - name: Fail if the committed build was stale
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html; then
            drift=$(git diff -U0 -- index.html | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vcE 'BUILD_INFO|BUILD_DATE' || true)
            git diff --stat -- index.html
            if [ "$drift" -gt 0 ]; then
              echo "::error::index.html is $drift lines behind app_template.html - rebuild and commit it"
              exit 1
            fi
            echo "index.html differs only by its build stamp / daily date, which is expected."
          fi 2>&1 | tee build-check.log

      - name: Capture failure detail
        if: failure()
        run: |
          mkdir -p qa-failures
          (grep -m1 -E '::error::|FAILED|Error:' build-check.log || tail -5 build-check.log) \
            > qa-failures/build-check.txt

      - name: Upload failure detail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-build-check
          path: qa-failures/build-check.txt
          retention-days: 7

  # Reads the freshly built index.html (its own build, not build-check's — see header note).
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: python poc_pipeline.py --build-html

      - name: Engine invariants + data integrity
        run: |
          set -o pipefail
          npm run test:engine 2>&1 | tee engine.log

      - name: Capture failure detail
        if: failure()
        run: |
          mkdir -p qa-failures
          (grep -m1 -E 'not ok|AssertionError|Error:' engine.log || tail -5 engine.log) \
            > qa-failures/engine.txt

      - name: Upload failure detail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-engine
          path: qa-failures/engine.txt
          retention-days: 7

  # movies.json is a committed catalogue file, not a build output, so this needs no build step.
  #
  # CAS-405: `daily.yml` refreshes movies.json from live TMDB/OMDb data every morning, and that
  # live drift used to trip most of test_data_quality.py's ~30 assertions on an ordinary day,
  # turning this job red and blocking `promote` for reasons that were not app breakage. Only the
  # test_data_quality checks that are genuine app-breakers still gate this job (run via
  # run_data_quality.py, see its header + BLOCKING_TESTS in test_data_quality.py); every other
  # check in that file still runs and is printed, but report-only. Every other file in tests/
  # (mocked-network, no API keys required) runs here unconditionally and still blocks.
  #
  # CAS-880: this job used to name only two of the tests/ modules, so any other test file
  # (pipeline/backfill/probe scripts added since) passed locally under `npm run test:data` but
  # never gated a promote. Discover all of them dynamically instead of listing files by name, so
  # a new test file added under tests/ is covered automatically. test_data_quality.py is excluded
  # here because it runs exactly once, via run_data_quality.py below.
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pipeline invariants
        run: |
          set -o pipefail
          MODULES=$(python -c "import pathlib; print(' '.join(f'tests.{p.stem}' for p in sorted(pathlib.Path('tests').glob('test_*.py')) if p.stem != 'test_data_quality'))")
          python -m unittest $MODULES 2>&1 | tee data.log

      - name: Catalogue data quality (blocking app-breakers; rest report-only)
        run: |
          set -o pipefail
          python -m tests.run_data_quality 2>&1 | tee -a data.log

      - name: Capture failure detail
        if: failure()
        run: |
          mkdir -p qa-failures
          (grep -m1 -E 'FAIL:|ERROR:|AssertionError' data.log || tail -5 data.log) \
            > qa-failures/data.txt

      - name: Upload failure detail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-data
          path: qa-failures/data.txt
          retention-days: 7

  # Also reads movies.json straight from the checkout — no build step needed here either.
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Monitor
        timeout-minutes: 8
        run: |
          set -o pipefail
          python -m unittest discover -s monitor/tests 2>&1 | tee monitor.log
          python -m monitor --dry-run 2>&1 | tee -a monitor.log

      - name: Capture failure detail
        if: failure()
        run: |
          mkdir -p qa-failures
          (grep -m1 -E 'FAIL:|ERROR:|AssertionError' monitor.log || tail -5 monitor.log) \
            > qa-failures/monitor.txt

      - name: Upload failure detail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-monitor
          path: qa-failures/monitor.txt
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # CAS-1006: matches package.json's test:lint set (device-parity, xss-sinks, review-prompt-copy)
      # so qa.yml and `npm run qa` gate on the same checks.
      - name: Lint (CAS-554, CAS-945, CAS-969 AC5)
        run: |
          set -o pipefail
          npm run test:lint 2>&1 | tee lint.log

      - name: Capture failure detail
        if: failure()
        run: |
          mkdir -p qa-failures
          (grep -m1 -E '^\[(R[0-9]+|ATTR-ESC|REVIEW-PROMPT-COPY)\]' lint.log || tail -5 lint.log) \
            > qa-failures/lint.txt

      - name: Upload failure detail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-lint
          path: qa-failures/lint.txt
          retention-days: 7

  # CAS-1006: package.json's test:scheduler (the cloudflare/scheduler worker's unit tests) was not run
  # in CI at all, so `npm run qa` and qa.yml gated on different sets. Pure node:test, no build/python
  # needed - the worker under test has no external deps.
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scheduler worker unit tests (CAS-1000)
        run: |
          set -o pipefail
          npm run test:scheduler 2>&1 | tee scheduler.log

      - name: Capture failure detail
        if: failure()
        run: |
          mkdir -p qa-failures
          (grep -m1 -E 'not ok|AssertionError' scheduler.log || tail -5 scheduler.log) \
            > qa-failures/scheduler.txt

      - name: Upload failure detail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-scheduler
          path: qa-failures/scheduler.txt
          retention-days: 7

  # CAS-1093: proves the server-first account-store rework against a REAL local Supabase (Supabase CLI +
  # Docker), not the no-Supabase environment every other job above runs in — that gap is how a sync pass
  # that deleted every agent on sign-in reached production undetected (2026-09-30). See
  # scripts/test-integrity.mjs and tests/e2e-integrity/account-integrity.spec.mjs's own headers for the
  # scenarios and why some are still `test.fixme()`. Because promote.yml fires on this whole workflow
  # succeeding, a red integrity job blocks the promote exactly like any other job here.
  #
  # CAS-1110: absorbed the old standalone `e2e` job — the smoke suite now also runs signed in against a
  # real local Supabase stack (scripts/test-e2e.mjs), so it needs the same Docker/Supabase CLI setup this
  # job already had. Running both suites here lets them share one `supabase start`/`stop` round trip
  # (scripts/lib/local-supabase.mjs's withLocalSupabase(), CASCADE_SHARE_STACK below) instead of paying it
  # twice on two separate runners. Each suite runs with `continue-on-error` so a red smoke suite still lets
  # the integrity suite run (and vice versa) — both signals matter and used to come from independent jobs —
  # with a final step failing the job if either did.
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      # Browser binaries are the slow part of `playwright install`. Cache them keyed on the
      # pinned @playwright/test version (via package-lock.json) so a normal run restores from
      # cache instead of downloading — only a version bump pays the download cost again.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # CAS-581: the browser *binary* above was already cached, but the OS packages `install-deps`
      # apt-get pulls underneath it were not - every run re-downloaded them from the apt mirrors,
      # ~7m47s of an ~8-minute job, and mirror slowness could stall the run long enough to get it
      # cancelled (CAS-552 made this job WebKit's much heavier dependency set). This caches apt's own
      # download cache, keyed on the same Playwright-version hash as the browser cache above, so a
      # Playwright version bump invalidates both together and pays the download cost once, not
      # silently installs OS deps for a stale version. apt-get itself always runs via sudo (root), so
      # ownership never blocks it - but actions/cache runs as the unprivileged runner user and cannot
      # write into a root-owned directory to restore/save the cache without this.
      - name: Allow caching the apt archive
        run: sudo chown "$(whoami)" /var/cache/apt/archives

      - name: Cache apt archives (webkit OS dependencies)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-webkit-${{ hashFiles('package-lock.json') }}

      - name: Install the matching browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit

      - name: Install browser OS dependencies (binary already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit

      # CAS-1093: scripts/test-integrity.mjs (and now scripts/test-e2e.mjs, CAS-1110) load schema.sql via
      # psql (a multi-statement script, which `supabase db query --file` can't run). Most ubuntu-latest
      # runners already carry it; this is a no-op when they do.
      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)

      - name: End to end (smoke gate, signed in)
        id: e2e_run
        continue-on-error: true
        timeout-minutes: 20
        # CAS-1110: tells scripts/lib/local-supabase.mjs's withLocalSupabase() to leave the stack it starts
        # running for the integrity step below, instead of stopping it — the runner is destroyed right
        # after this job ends either way, so nothing is left running beyond this job's own lifetime.
        env:
          CASCADE_SHARE_STACK: "1"
        run: |
          set -o pipefail
          npm run test:e2e -- --retries=1 2>&1 | tee e2e.log

      - name: Keep the report when it goes red
        if: steps.e2e_run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Capture e2e failure detail
        if: steps.e2e_run.outcome == 'failure'
        run: |
          mkdir -p qa-failures
          (grep -m1 -E '✘|[0-9]+\) .+ › ' e2e.log || tail -5 e2e.log) \
            > qa-failures/e2e.txt

      - name: Upload e2e failure detail
        if: steps.e2e_run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-e2e
          path: qa-failures/e2e.txt
          retention-days: 7

      - name: Account integrity (local Supabase)
        id: integrity_run
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          npm run test:integrity 2>&1 | tee integrity.log

      # CAS-1093 (decision, 2026-10-01 build chat): unlike the smoke suite's "if: failure()" report upload,
      # this runs every time — a green run's traces are what a *next* flake needs to compare against, and
      # this job (unlike the smoke suite's matrix) is a single worker, so the artifact stays small.
      - name: Upload integrity report (HTML + traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integrity
          path: |
            playwright-report-integrity/
            test-results/
          retention-days: 7

      - name: Capture integrity failure detail
        if: steps.integrity_run.outcome == 'failure'
        run: |
          mkdir -p qa-failures
          (grep -m1 -E '✘|[0-9]+\) .+ › |Error:' integrity.log || tail -5 integrity.log) \
            > qa-failures/integrity.txt

      - name: Upload integrity failure detail
        if: steps.integrity_run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-integrity
          path: qa-failures/integrity.txt
          retention-days: 7

      # CAS-1110: both suites above ran with continue-on-error so each gets to finish regardless of the
      # other, which also means a failing suite does not already fail this job on its own — do that here.
      - name: Fail the job if either suite failed
        if: steps.e2e_run.outcome == 'failure' || steps.integrity_run.outcome == 'failure'
        run: exit 1

  # CAS-462: Jira checkpoint only — no build artefact depends on this, so it runs after the
  # other jobs (not in parallel with them) and only on green, via `needs:`.
  mark-on-staging:
    needs: [build-check, engine, data, monitor, lint, scheduler, integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mark shipped tickets On Staging
        env:
          JIRA_BASE_URL:  ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:     ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RANGE_FROM: ${{ github.event.before }}
          RANGE_TO:   ${{ github.sha }}
        run: python ci/mark_on_staging.py

  # CAS-759: promote.yml's `workflow_run` trigger never fires for a qa run that was itself
  # started by a GITHUB_TOKEN-authenticated `workflow_dispatch` call (daily.yml's CAS-523 step) —
  # GitHub's anti-recursion protection suppresses that event the same way it suppresses `push`.
  # A daily-refresh-only push could reach `staging` and pass qa, but never reach `main`. This
  # job dispatches promote.yml directly for exactly that case. The `workflow_dispatch` guard is
  # the important half: a qa run triggered by a normal `push` still promotes through
  # promote.yml's own `workflow_run` trigger as before — without the guard every push would
  # dispatch promote twice.
  dispatch-promote:
    needs: [build-check, engine, data, monitor, lint, scheduler, integrity]
    if: success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    # Creating a workflow_dispatch event via the API needs actions:write, which the top-level
    # `permissions:` block above does not grant — this job (only) needs its own grant.
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch promote.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote.yml --ref main

  # CAS-482: the failure-path mirror of mark-on-staging above. `if: failure()` on a job whose
  # `needs` list is the same QA jobs runs exactly when at least one of them went red — GitHub's
  # default failure propagation. Each QA job already uploaded a qa-failure-<job> artifact with its
  # first failing line (see the "Capture failure detail" steps above) if it failed.
  on-failure:
    needs: [build-check, engine, data, monitor, lint, scheduler, integrity]
    if: failure()
    # download-artifact's `pattern` option lists this run's artifacts via the Actions API, which
    # needs actions:read — the top-level `permissions:` block above restricts every other scope to
    # none, so this job (only) needs its own grant.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download failure detail artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qa-failure-*
          path: qa-failures
          merge-multiple: true
        continue-on-error: true

      - name: Determine failed job(s) + first failure detail
        env:
          BUILD_CHECK: ${{ needs.build-check.result }}
          ENGINE:      ${{ needs.engine.result }}
          DATA:        ${{ needs.data.result }}
          MONITOR:     ${{ needs.monitor.result }}
          LINT:        ${{ needs.lint.result }}
          SCHEDULER:   ${{ needs.scheduler.result }}
          INTEGRITY:   ${{ needs.integrity.result }}
        run: |
          FAILED=""
          DETAIL=""
          for pair in "build-check:$BUILD_CHECK" "engine:$ENGINE" "data:$DATA" "monitor:$MONITOR" "lint:$LINT" "scheduler:$SCHEDULER" "integrity:$INTEGRITY"; do
            name="${pair%%:*}"; result="${pair##*:}"
            if [ "$result" = "failure" ]; then
              FAILED="${FAILED:+$FAILED, }$name"
              # CAS-1110: the integrity job now also runs the e2e smoke suite (qa.yml's merged job), so its
              # failure detail may be qa-failures/e2e.txt, qa-failures/integrity.txt or both — prefer e2e's
              # since the smoke suite runs first.
              if [ -z "$DETAIL" ] && [ "$name" = "integrity" ] && [ -f "qa-failures/e2e.txt" ]; then
                DETAIL=$(head -1 "qa-failures/e2e.txt")
              elif [ -z "$DETAIL" ] && [ -f "qa-failures/${name}.txt" ]; then
                DETAIL=$(head -1 "qa-failures/${name}.txt")
              fi
            fi
          done
          echo "FAILED_JOBS=${FAILED:-(unknown)}" >> "$GITHUB_ENV"
          echo "FAILURE_DETAIL=${DETAIL:-(no failure detail captured)}" >> "$GITHUB_ENV"

      - name: Report failure + requeue the ticket
        env:
          JIRA_BASE_URL:  ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:     ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RANGE_FROM: ${{ github.event.before }}
          RANGE_TO:   ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_JOBS: ${{ env.FAILED_JOBS }}
          FAILURE_DETAIL: ${{ env.FAILURE_DETAIL }}
        run: python ci/mark_qa_failed.py

  # CAS-973: email someone the moment this workflow breaks, instead of leaving it to be
  # noticed by whoever next opens the Actions tab. Separate concern from on-failure above
  # (which requeues the Jira ticket) — needs every other job so it fires whichever one broke.
  alert:
    needs: [build-check, engine, data, monitor, lint, scheduler, integrity, mark-on-staging, dispatch-promote, on-failure]
    if: failure()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/alert.yml
    with:
      workflow_name: "qa"
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CASCADE_EMAIL_FROM: ${{ secrets.CASCADE_EMAIL_FROM }}
      CASCADE_ALERT_TO: ${{ secrets.CASCADE_ALERT_TO }}
