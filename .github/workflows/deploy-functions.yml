name: Deploy edge functions (CAS-1523)

# workflow_dispatch ONLY. Deploys membership-verify and membership-notifications to the Supabase
# project held by the chosen GitHub Environment. SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are
# secrets of that environment. Never runs on push/schedule.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment (Supabase project) to deploy to"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF are not set on the '${{ inputs.environment }}' environment."
            exit 1
          fi
          for fn in membership-verify membership-notifications; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
