name = "cascade-scheduler"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"

[triggers]
crons = [
  "17 * * * *",  # every hour -> uptime.yml
  "0 14 * * *",  # candidate -> daily.yml, only when this is 01:00 in Sydney (AEDT)
  "0 15 * * *",  # candidate -> daily.yml, only when this is 01:00 in Sydney (AEST)
  "0 16 * * *",  # candidate -> alerts.yml, only when this is 03:00 in Sydney (AEDT)
  "0 17 * * *",  # candidate -> alerts.yml, only when this is 03:00 in Sydney (AEST)
  "*/5 * * * *", # candidate -> recommend.yml, only when Supabase reports unsent mail
]
